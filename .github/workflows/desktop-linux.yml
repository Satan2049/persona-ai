name: Desktop Linux

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "apps/desktop/**"
      - "apps/backend/**"
      - "ui/**"
      - "data/**"
      - "assets/**"
      - "scripts/build-sidecar.sh"
      - ".github/workflows/desktop-linux.yml"
  pull_request:
    paths:
      - "apps/desktop/**"
      - "apps/backend/**"
      - "ui/**"
      - "scripts/build-sidecar.sh"
      - ".github/workflows/desktop-linux.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Linux WebKit / Tauri deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable

      - name: Sync UI into Tauri public/
        run: |
          rm -rf apps/desktop/public
          mkdir -p apps/desktop/public
          cp -a ui/. apps/desktop/public/

      - name: npm install
        run: npm install

      - name: Python venv + deps
        run: |
          python -m venv apps/backend/.venv
          apps/backend/.venv/bin/python -m pip install -U pip
          apps/backend/.venv/bin/python -m pip install -r apps/backend/requirements-dev.txt

      - name: Build sidecar
        run: |
          chmod +x scripts/build-sidecar.sh
          ./scripts/build-sidecar.sh

      - name: Build Tauri (AppImage + deb)
        working-directory: apps/desktop
        run: npx tauri build --bundles appimage,deb

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: persona-ai-linux
          path: |
            apps/desktop/src-tauri/target/release/bundle/appimage/*
            apps/desktop/src-tauri/target/release/bundle/deb/*
          if-no-files-found: warn
