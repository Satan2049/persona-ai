name: Desktop macOS

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "apps/desktop/**"
      - "apps/backend/**"
      - "ui/**"
      - "data/**"
      - "assets/**"
      - "scripts/build-sidecar.sh"
      - ".github/workflows/desktop-macos.yml"
  pull_request:
    paths:
      - "apps/desktop/**"
      - "apps/backend/**"
      - "ui/**"
      - "scripts/build-sidecar.sh"
      - ".github/workflows/desktop-macos.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Sync UI into Tauri public/
        run: |
          rm -rf apps/desktop/public
          mkdir -p apps/desktop/public
          cp -a ui/. apps/desktop/public/

      - name: npm install
        run: npm install

      - name: Python venv + deps
        run: |
          python -m venv apps/backend/.venv
          apps/backend/.venv/bin/python -m pip install -U pip
          apps/backend/.venv/bin/python -m pip install -r apps/backend/requirements-dev.txt

      - name: Build sidecar
        run: |
          chmod +x scripts/build-sidecar.sh
          ./scripts/build-sidecar.sh

      - name: Build Tauri (DMG)
        working-directory: apps/desktop
        run: npx tauri build --bundles dmg

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: persona-ai-macos
          path: |
            apps/desktop/src-tauri/target/release/bundle/dmg/*
            apps/desktop/src-tauri/target/release/bundle/macos/*
          if-no-files-found: warn

      - name: Collect release assets + SHA256
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p dist/release
          shopt -s nullglob
          for f in apps/desktop/src-tauri/target/release/bundle/dmg/*; do
            [[ -f "$f" ]] || continue
            cp -f "$f" "dist/release/$(basename "$f")"
          done
          if [[ -z "$(ls -A dist/release 2>/dev/null)" ]]; then
            echo "No macOS DMG files to publish" >&2
            exit 1
          fi
          (
            cd dist/release
            shasum -a 256 * | tee SHA256-macos.txt
          )
          ls -lah dist/release

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/release/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
